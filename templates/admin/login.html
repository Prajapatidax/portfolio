{% extends "base.html" %}

{% block content %}
<main class="min-h-[80vh] flex items-center justify-center px-4 py-16">
    <div class="max-w-md w-full bg-white rounded-3xl border border-gray-200 shadow-xl p-8 sm:p-10">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100 shadow-sm">
                <span class="material-symbols-outlined !text-[28px]">shield</span>
            </div>
            <h1 class="text-2xl font-extrabold text-gray-900">Admin Sign In</h1>
            <p class="text-xs text-gray-500 mt-1">Authorized portfolio management portal</p>
        </div>

        {% if error %}
        <div class="p-4 mb-6 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs font-semibold flex items-center gap-2">
            <span class="material-symbols-outlined !text-[18px]">error</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="{{ url_for('admin.admin_login') }}" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="admin-email" class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-1">Email Address</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 !text-[18px]">mail</span>
                    <input id="admin-email" name="email" type="email" placeholder="admin@prajapatidax.co.in" required autocomplete="username" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 text-xs font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label for="admin-password" class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-1">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3.5 top-3 text-gray-400 !text-[18px]">lock</span>
                    <input id="admin-password" name="password" type="password" placeholder="••••••••••••" required autocomplete="current-password" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 text-xs font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3.5 rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center justify-center gap-2 mt-2 hover:scale-[1.02] active:scale-[0.98]">
                <span>Authenticate Session</span>
                <span class="material-symbols-outlined !text-[16px]">arrow_forward</span>
            </button>
        </form>

        <div class="mt-8 pt-4 border-t border-gray-100 text-center">
            <a href="{{ url_for('main.index') }}" class="text-xs font-medium text-gray-400 hover:text-gray-600">
                &larr; Return to main website
            </a>
        </div>
    </div>
</main>
{% endblock %}
